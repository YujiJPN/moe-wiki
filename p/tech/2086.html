<div class="lead">バジリスクの毒</div><section id="s0"><h2>基本データ</h2><dl class="kv"><dt>種類</dt><dd>スキル・補助</dd><dt>必要スキル</dt><dd><a href="../../p/skill/hb57679695537.html">素手</a> 1</dd><dt>発動時間</dt><dd>0.32 秒</dd><dt>ディレイ</dt><dd>0.32 秒</dd><dt>射程</dt><dd>5</dd><dt>範囲</dt><dd>扇形 120°</dd><dt>属性</dt><dd>地</dd><dt>対象</dt><dd>敵</dd></dl></section><section id="s1"><h2>効果</h2><p>効果時間：2.08 秒（2.08 秒ごとに 1 回。回数は効果量で変わる）</p><ul><li>毒：一定時間ごとに 3.3 のダメージ</li></ul></section><section id="s2"><h2>使用条件・その他</h2><dl class="kv"><dt>性質</dt><dd>術者ごとに 1 つまで、使えないマップがある</dd><dt>上書き</dt><dd><a href="../../p/tech/301.html">バジリスク ミートボム</a>、<a href="../../p/tech/362.html">猛毒</a>、<a href="../../p/tech/2045.html">血清</a>、<a href="../../p/tech/2055.html">ポイズン ブレス</a>、<a href="../../p/tech/2122.html">ポイズン スピット</a> と同じグループ。順位 0（順位の高い効果が残る）</dd></dl></section>
