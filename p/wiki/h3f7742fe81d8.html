<section id="s0"><h2>ルール（1 件）</h2><ul class="feats"><li>古びた地図の一覧：3冊のバインダーに約235枚。対象エリア、ランク（F、E、D、C、B、A、S、特殊）、必要スキル、ドロップ元（そのゾーンの mob、ほかの mob、釣り）、ランク別のネタバレ一覧（宝箱の座標とガーディアン）。プレイヤーによる訂正もある。古びた地図はモンスターのドロップ（0.03-0.4 %）。地図ごとに宝の位置とガーディアンが決まっている。 <a href="../../p/rule/audit-10.html#A1362">→</a></li></ul></section>
