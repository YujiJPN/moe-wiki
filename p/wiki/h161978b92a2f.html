<main><div class="crumbs"><a href="../../p/wiki/FrontPage.html">トップ</a></div><h1><span class="kind">項目</span>ミニゲーム</h1>
<section id="s0"><h2>ルール（1 件）</h2><ul class="feats"><li>Webミニゲーム：もえガチャ（必ずアイテムが出て、ハズレなし。動物ガチャもある。ろぼガチャは終了）、もばガチャ、精錬の泉（アイテムを泉に投げ込むと強化されて戻る。運しだいで、確率を上げる方法もある。消えたアイテムは「愛」で復活に賭けられる）、錬金の森（木に2種類のアイテムを投げ込むと、決まった新しいアイテムに変わる。できたものはさらに合成できる）。どれもWebサイトのゲーム。ゲーム内のミニゲームは、ポーカー、ブラックジャック、スロット、リズムゲーム。 <a href="../../p/rule/audit-21.html#A2294">→</a></li></ul></section>
